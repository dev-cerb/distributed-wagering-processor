services:
  postgres:
    image: postgres:16
    container_name: dwp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_dev
    ports:
      - '5432:5432'
    volumes:
      - wagering_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: wagering-localstack
    ports:
      - '4566:4566'
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - './localstack/init:/etc/localstack/init/ready.d'

volumes:
  wagering_postgres_data:
